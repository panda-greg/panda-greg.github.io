  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

vw,19px); line-height: 1.55; color: #3a3d36; max-width: 60ch; margin-top: 24px; font-family: Space Grotesk\">Seven years, and the list is strange: back-office robots for a bank, ML on gold recovery, process mining, a $400k warehouse project I sold and then architected, a KPI system a thousand civil servants use. I'm good at the part where a vague business problem becomes a working system. <br><b>Everything else I learn.<\u002Fb><\u002Fp><div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;font-family:'JetBrains Mono',monospace;font-size:13px\">\n        <a href=\"#dashboards\" style=\"padding:13px 20px;background:#0e3d38;color:#fff;border-radius:6px\">$ cd ./solutions ↓<\u002Fa>\n        <a href=\"mailto:gregorysebalo@yahoo.com\" style=\"padding:13px 20px;background:#b9f227;color:#16180f;border-radius:6px;font-weight:700\">$ ./contact<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- photo -->\n    <div class=\"r-photo\" style=\"position:relative;width:100%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1.5px solid #0e3d38;background-color:#e4e1d6;justify-self:center\">\n      <img src=\"16664204-c3e3-437e-a63c-9f8da0367345\" alt=\"Grigory Yakushev\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top\">\n      <span style=\"position:absolute;top:12px;left:12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:#b9f227;background:rgba(14,61,56,.82);padding:4px 9px;border-radius:4px\">$ open ./me.jpg<\u002Fspan>\n      <span style=\"position:absolute;top:14px;right:13px;width:9px;height:9px;background:#b9f227;border-radius:50%;box-shadow:0 0 0 3px rgba(14,61,56,.4)\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- marquee -->\n  <div style=\"overflow:hidden;border-top:1.5px solid #0e3d38;border-bottom:1.5px solid #0e3d38;padding:12px 0\">\n    <div style=\"display:flex;width:max-content;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spac ins Mono',monospace;font-size:11px;line-height:1.4;color:#3a3d36;margin-top:8px\">{{ a.l }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:18px\">\n          <sc-for list=\"{{ job.tags }}\" as=\"tag\" hint-placeholder-count=\"4\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border:1px solid rgba(14,61,56,.55);border-radius:3px;color:#0e3d38;background:rgba(237,234,226,.55)\">{{ tag }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <!-- dashboards portfolio -->\n  <div id=\"dashboards\" style=\"margin-top:24px;background:#0e3d38;padding:clamp(40px,6vw,56px) clamp(20px,5vw,56px) clamp(38px,6vw,54px);scroll-margin-top:10px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#b9f227\">$ ls ~/solutions<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(40px,8vw,64px);line-height:.92;letter-spacing:-.03em;color:#eef3f1;margin-top:14px\">Solutions<br><span style=\"color: rgb(185, 242, 39);\">I build.<\u002Fspan><\u002Fh2>\n    \n    <div style=\"margin-top:34px;border:1.5px dashed #7fae0e;border-radius:10px;background-color:#0b322e;background-image:repeating-linear-gradient(135deg,rgba(185,242,39,.07) 0 1px,transparent 1px 15px);padding:clamp(40px,7vw,72px) clamp(24px,5vw,48px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#b9f227\">$ make dashboard --interactive<\u002Fspan>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(14px,2.4vw,16px);color:#eef3f1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center\">\n        <span style=\"display:inline-flex;align-items:center ps://github.com/panda-greg\"><span style=\"color:#b9f227\">→ <\u002Fspan>github.com/panda-greg<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const jobs = [\n      { idx: \"05\", company: \"Freelance\", role: \"Analytics Engineer\", meta: \"Independent · self-directed\", period: \"Nov 2025 — Now\", blurb: \"Sharpening the modern stack, end to end.\", points: [\"Studied <strong style='font-weight:700;color:#0e3d38'>dbt<\u002Fstrong> and built hands-on transformation pipelines\", \"Shipped an end-to-end <strong style='font-weight:700;color:#0e3d38'>Python<\u002Fstrong> analytics bot: ingests daily data from multiple sources into <strong style='font-weight:700;color:#0e3d38'>PostgreSQL<\u002Fstrong> and uses an <strong style='font-weight:700;color:#0e3d38'>LLM (Claude)<\u002Fstrong> for automated week-over-week insights, delivered via <strong style='font-weight:700;color:#0e3d38'>Telegram<\u002Fstrong>\", \"Building foundations in <strong style='font-weight:700;color:#0e3d38'>blockchain / Web3<\u002Fstrong> — smart contracts and on-chain data\"], tags: [\"dbt\", \"Python\", \"PostgreSQL\", \"Claude / LLM\", \"Telegram\"] },\n      { idx: \"04\", company: \"Cifrolab\", role: \"Software Architect / Product Owner\", meta: \"3-month build-and-launch mandate\", period: \"Apr — Nov 2025\", blurb: \"Built and launched a city-scale KPI platform from scratch in 3 months.\", points: [\"Led a <strong style='font-weight:700;color:#0e3d38'>6-person team<\u002Fstrong> of analysts and full-stack developers\", \"Scaled the live product to <strong style='font-weight:700;color:#0e3d38'>1,000+ users<\u002Fstrong>, <strong style='font-weight:700;color:#0e3d38'>800+ input forms<\u002Fstrong> and <strong style='font-weight:700;color:#0e3d38'>5,000+ KPIs<\u002Fstrong>; presented outcomes directly to a city-government minister\", \"Designed the UX/UI in <strong style='font-weight:700;color:#0e3d38'>Figma<\u002Fstrong>, defined the architecture, and owned the product through launch and post-release iteration\"], tags: [\"Python\", \"PostgreSQL\", \"Figma\", \"Product\", \"Architecture\"] },\n      { idx: \"03\", company: \"Softline\", role: \"BI / Data Warehouse Architect\", meta: \"BI/DWH expert · technical presales\", period: \"Sep 2024 — Apr 2025\", blurb: \"Led technical solution design and effort estimates for BI/DWH proposals as the presales BI/DWH expert.\", points: [\"<strong style='font-weight:700;color:#0e3d38'>Johnson &amp; Johnson<\u002Fstrong> — global healthcare (<strong style='font-weight:700;color:#0e3d38'>Qlik<\u002Fstrong>, <strong style='font-weight:700;color:#0e3d38'>Snowflake<\u002Fstrong>)\", \"<strong style='font-weight:700;color:#0e3d38'>Alfa-Bank<\u002Fstrong> — <strong style='font-weight:700;color:#0e3d38'>Power BI<\u002Fstrong>, <strong style='font-weight:700;color:#0e3d38'>MS SQL<\u002Fstrong>\", \"<strong style='font-weight:700;color:#0e3d38'>Kamaz<\u002Fstrong> — <strong style='font-weight:700;color:#0e3d38'>Visiology<\u002Fstrong>\"], tags: [\"Qlik\", \"Snowflake\", \"Power BI\", \"MS SQL\", \"Visiology\"] },\n      { idx: \"02\", company: \"BearingPoint\", role: \"Senior Consultant → Expert\", meta: \"now BeringPro · global consultancy\", period: \"Nov 2019 — Sep 2024\", blurb: \"Co-sold a $400k+ BI/DWH project; promoted from Senior Consultant to Expert.\", points: [\"Architected and led a <strong style='font-weight:700;color:#0e3d38'>5-person team<\u002Fstrong> to rebuild enterprise BI and a <strong style='font-weight:700;color:#0e3d38'>PostgreSQL<\u002Fstrong> warehouse on an open-source stack for a global packaging manufacturer — replacing a legacy <strong style='font-weight:700;color:#0e3d38'>Qlik<\u002Fstrong> + <strong style='font-weight:700;color:#0e3d38'>SAP BW<\u002Fstrong> system from screenshots alone, as architect, tech lead and lead developer\", \"Delivered 10+ <strong style='font  [4, 3], [3, 5], [4, 6], [1, 3], [0, 2], [4, 5]]; let s = \"\"; e.forEach(([a, b]) => { s += `<line x1='${n[a][0]}' y1='${n[a][1]}' x2='${n[b][0]}' y2='${n[b][1]}' stroke='rgba(14,61,56,.16)' stroke-width='1.5'/>`; }); n.forEach((p, i) => { s += `<circle cx='${p[0]}' cy='${p[1]}' r='${i % 3 === 0 ? 9 : 5}' fill='${i % 3 === 0 ? \"rgba(185,242,39,.55)\" : \"rgba(14,61,56,.24)\"}'/>`; }); return s; }\n    };\n    const mkSvg = (kind) => \"data:image/svg+xml,\" + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 400' preserveAspectRatio='xMidYMid slice'>${B[kind]()}<\u002Fsvg>`);\n    const kindByIdx = { \"05\": \"network\", \"04\": \"bars\", \"03\": \"wave\", \"02\": \"rings\", \"01\": \"dots\" };\n    jobs.forEach(j => {\n      j.achievements = ach[j.idx];\n      j.points = j.points.map(p => {\n        const parts = p.split(/(<strong[^>]*>.*?<\\/strong>)/g).filter(Boolean);\n        const dec = (s) => s.replace(/&amp;/g, \"&\").replace(/&lt;/g, \"<\").replace(/&gt;/g, \">\");\n        const nodes = parts.map((seg, i) => {\n          const m = seg.match(/^<strong[^>]*>(.*?)<\\/strong>$/);\n          return m\n            ? React.createElement(\"strong\", { key: i, style: { fontWeight: 700, color: \"#0e3d38\" } }, dec(m[1]))\n            : dec(seg);\n        });\n        return React.createElement(React.Fragment, null, ...nodes);\n      });\n      const uri = mkSvg(kindByIdx[j.idx]);\n      // decorative abstract background built at runtime (no static img src for the bundler to scan)\n      j.bg = React.createElement(\"div\", {\n        \"aria-hidden\": \"true\",\n        style: { position: \"absolute\", inset: 0, backgroundImage: `url(\"${uri}\")`, backgroundSize: \"cover\", backgroundPosition: \"right center\", backgroundRepeat: \"no-repeat\", opacity: 0.55, pointerEvents: \"none\" }\n      });\n    });\n\n    return { jobs, marqueeTokens: [\"SQL\",\"DBT\",\"AIRFLOW\",\"NIFI\",\"POSTGRESQL\",\"SNOWFLAKE\",\"SAP\\u00A0BW/4HANA\",\"POWER\\u0
